name: SceneRights AI CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  compliance-and-build:
    name: Compliance Gate, Tests & Production Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: "services/api/pyproject.toml"

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: "apps/web/package-lock.json"

      - name: Install Backend Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e services/api[test]

      - name: Install Frontend Dependencies
        run: |
          cd apps/web
          npm ci

      - name: Run SceneRights Compliance Gate
        run: |
          python scripts/compliance_gate.py

      - name: Run Backend Unit & Integration Tests
        run: |
          cd services/api
          pytest -v

      - name: Run Frontend Production Build
        run: |
          cd apps/web
          npm run build

      - name: Run Secret Scanning (Gitleaks)
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
