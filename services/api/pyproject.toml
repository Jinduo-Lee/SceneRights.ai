[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"

[project]
name = "scenerights-api"
version = "0.1.0"
description = "SceneRights AI FastAPI Backend Service"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.110.0,<1.0.0",
    "uvicorn[standard]>=0.28.0,<1.0.0",
    "pydantic>=2.6.0,<3.0.0",
    "pydantic-settings>=2.2.0,<3.0.0",
    "clickhouse-connect>=0.7.0,<1.0.0"
]

[project.optional-dependencies]
test = [
    "pytest>=8.0.0,<9.0.0",
    "httpx>=0.27.0,<1.0.0"
]
